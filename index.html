<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Long Covid Portál — Odkazy</title>
  <meta property="og:title" content="Long Covid Portál — Odkazy">
  <meta property="og:description" content="Odkazy na sociální sítě České asociace pro long covid (ČALC). Sledujte nás na Instagramu, Facebooku a YouTube.">
  <meta property="og:type" content="website">
  <meta name="description" content="Odkazy na sociální sítě České asociace pro long covid (ČALC). Sledujte nás na Instagramu, Facebooku a YouTube.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #FCFAF9;
      color: #000000;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 48px 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* ---- Logo ---- */

    .logo {
      width: 280px;
      max-width: 80%;
      margin-bottom: 12px;
    }

    .logo img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ---- Tagline ---- */

    .tagline {
      font-size: 0.875rem;
      font-weight: 300;
      color: #808080;
      letter-spacing: 0.02em;
      margin-bottom: 40px;
      text-align: center;
    }

    /* ---- Links ---- */

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 24px;
      background-color: #1F9094;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 50px;
      transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .link-btn:hover {
      background-color: #8FC6C8;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(31, 144, 148, 0.25);
    }

    .link-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .link-btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      fill: #ffffff;
    }

    /* ---- Section divider ---- */

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #808080;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 40px;
      margin-bottom: 4px;
      text-align: center;
    }

    /* ---- Outline variant ---- */

    .link-btn.outline {
      background-color: transparent;
      color: #1F9094;
      border: 2px solid #1F9094;
    }

    .link-btn.outline svg {
      fill: #1F9094;
    }

    .link-btn.outline:hover {
      background-color: #1F9094;
      color: #ffffff;
    }

    .link-btn.outline:hover svg {
      fill: #ffffff;
    }

    /* ---- Footer ---- */

    .footer {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding: 32px 24px 24px;
      font-size: 0.75rem;
      font-weight: 300;
      color: #808080;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Logo -->
    <div class="logo">
      <img src="assets/logo-portal.svg" alt="Long Covid Portal">
    </div>

    <!-- Tagline -->
    <p class="tagline">Česká asociace pro long covid</p>

    <!-- Social links -->
    <nav class="links" aria-label="Odkazy na sociální sítě">

      <!-- Instagram -->
      <a class="link-btn" href="https://www.instagram.com/longcovidportal/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2Zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5a4.25 4.25 0 0 0 4.25-4.25v-8.5A4.25 4.25 0 0 0 16.25 3.5h-8.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 1.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm5.25-2.5a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/>
        </svg>
        Instagram
      </a>

      <!-- Facebook -->
      <a class="link-btn" href="https://www.facebook.com/longcovidportal" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12Z"/>
        </svg>
        Facebook
      </a>

      <!-- YouTube -->
      <a class="link-btn" href="https://www.youtube.com/@longcovidportal" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M21.543 6.498C22 8.28 22 12 22 12s0 3.72-.457 5.502c-.254.985-.997 1.76-1.938 2.022C17.896 20 12 20 12 20s-5.893 0-7.605-.476c-.945-.266-1.687-1.04-1.938-2.022C2 15.72 2 12 2 12s0-3.72.457-5.502c.254-.985.997-1.76 1.938-2.022C6.107 4 12 4 12 4s5.896 0 7.605.476c.945.266 1.687 1.04 1.938 2.022ZM10 15.5l6-3.5-6-3.5v7Z"/>
        </svg>
        YouTube
      </a>

      <!-- Email -->
      <a class="link-btn" href="mailto:info@longcovidportal.cz">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 2-8 5-8-5h16Zm0 12H4V8l8 5 8-5v10Z"/>
        </svg>
        E-mail
      </a>

    </nav>

    <!-- Resource links -->
    <p class="section-label">Užitečné odkazy</p>
    <nav class="links" aria-label="Užitečné odkazy">

      <a class="link-btn outline" href="https://tinyurl.com/CALC-uzitecne-odkazy" target="_blank" rel="noopener noreferrer">
        Užitečné zdroje
      </a>

      <a class="link-btn outline" href="https://tinyurl.com/CALC-LC-media" target="_blank" rel="noopener noreferrer">
        Long covid v médiích
      </a>

      <a class="link-btn outline" href="https://tinyurl.com/CALC-UtF2024" target="_blank" rel="noopener noreferrer">
        Materiály z konference UtF
      </a>

      <a class="link-btn outline" href="https://tinyurl.com/CALC-praxe" target="_blank" rel="noopener noreferrer">
        Návody a doporučení z klinické praxe
      </a>

    </nav>

  </div>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2025 Česká asociace pro long covid, z.s.
  </footer>

</body>
</html>
